name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-west-1
  TF_VERSION: 1.6.0

jobs:
  Validate-and-plan:
    name: Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
        env:
          TF_VAR_ssh_key_public: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_ssh_key_public: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 3

  Trivy_security_scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: Validate-and-plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          ignore-unfixed: true
          hide-progress: false
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: 0

  Terraform-apply:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [Validate-and-plan, Trivy_security_scan]
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save Outputs to File
        run: |
          terraform output -json > outputs.json
          echo "WEB_IP=$(terraform output -raw web_public_ip)" >> $GITHUB_ENV

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform/outputs.json

  ansible-deploy:
    name: Configure Server
    runs-on: ubuntu-latest
    needs: Terraform-apply
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: terraform/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible boto3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws_project_key
          chmod 600 ~/.ssh/aws_project_key

      - name: Extract Web IP
        id: get_ip
        run: |
          WEB_IP=$(python3 -c "import json; print(json.load(open('../terraform/outputs.json'))['web_public_ip']['value'])")
          echo "WEB_IP=$WEB_IP" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_secrets

          ansible-playbook -i "${{ env.WEB_IP }}," playbook.yml \
            -u ubuntu \
            --private-key ~/.ssh/aws_project_key \
            --vault-password-file .vault_secrets \
            --extra-vars "db_user_password=${{ secrets.DB_PASSWORD }}"
            rm .vault_secrets
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
